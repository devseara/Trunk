###########################################################################
# Enchant Grade Color Database - Import
###########################################################################
#
# Override or add enchant grade colors here.
# Entries in this file take precedence over db/enchantgrade_color_db.yml.
#
# Format:
#   - Grade: <number>          (1=Rare, 2=Epic, 3=Mythic, 4=Legendary, 5=S)
#     Label: <display label without brackets>
#     Color: <RRGGBB hex>
#
# Examples:
#   - Grade: 4
#     Label: Legendary
#     Color: FFD700
#
#   # Adding a new grade (requires enum entry in mmo.hpp):
#   - Grade: 6
#     Label: Ancient
#     Color: FF8800
#
###########################################################################

Header:
  Type: ENCHANTGRADE_COLOR_DB
  Version: 1

Body:
  - Grade: 1
    Label: Rare
    Color: FFD700
  - Grade: 2
    Label: Epic
    Color: FFD700
  - Grade: 3
    Label: Mythic
    Color: FFD700
  - Grade: 4
    Label: Legendary
    Color: FFD700
  - Grade: 5
    Label: S
    Color: FFD700
