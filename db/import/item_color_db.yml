###########################################################################
# Item Color Database
###########################################################################
#
# Item Color Settings
#
###########################################################################
# Item Color Database
# Maps item names to custom display colors.
# The client-side WARP QJS patch uses substring matching, so short distinctive
# names work best (e.g. "Angra" matches "Angra Manyu").
#
# Format:
#   - Item: <item name or substring>
#     Color: <RRGGBB hex>
#
# Color format: RRGGBB (standard web hex). Examples:
#   FF0000 = Red
#   00FF00 = Green
#   0000FF = Blue
#   FFA500 = Orange
#   DA70D6 = Orchid
#   FFD700 = Gold
#
#   Common      = FFFFFF  (White)
#   Uncommon    = 00FF00  (Green)
#   Rare        = 0000FF  (Blue)
#   Epic        = A020F0  (Purple)
#   Legendary   = FFD700  (Gold)
#   Mythic      = DC143C  (Crimson Red)
###########################################################################

Header:
  Type: ITEM_COLOR_DB
  Version: 1

Body:
   - Item: Sunglasses
     Color: 0xFFF700
