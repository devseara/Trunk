###########################################################################
# Fake Players Database (Shakto) — Profiles, Curves & Spawn Semantics (EN)
###########################################################################
#
# Overview
# - This YAML controls how many fake players (bots) are active, which job
#   profiles they use, where they spawn/idle in towns, and which behaviors
#   they run. Each top-level entry under Body is a *population profile*
#   (e.g., “novice_world”, “starter_world”).
#
# File Layout
# - Header:
#     Type: FAKE_PLAYERS_DB
#     Version: 1
# - Body:
#     A list of Profiles maps (schema below).
#
###########################################################################
# Profiles entry (schema)
###########################################################################
# Profiles                 Unique population profile id (string).
#
# LevelMin / LevelMax      Inclusive base-level range for bots created by this
#                          population profile. (Job profile stats/gear still
#                          come from FAKE_JOBPROFILS_DB.)
#
# Curve                    Time-of-day/week scaling for target population.
#   Enabled                Toggle curve application (true/false).
#   SmoothingMinutes       Time window to smooth target changes; avoids sharp
#                          jumps when the hourly target changes.
#   WeekendBoost           Multiplier applied on weekend days in addition to the
#                          WeekendProfile (e.g., 1.10 = 10%).
#   PercLow                Lower cap as percent of the base Number (e.g., 10=10%).
#   PercHigh               Upper cap as percent of the base Number (e.g., 150=150%).
#   HourlyProfile          24 integers for Mon–Fri target shape (index 0..23 hours).
#   WeekendProfile         24 integers for Sat–Sun target shape (index 0..23 hours).
# Notes:
# - The engine derives a *time-weight* from HourlyProfile/WeekendProfile based on
#   local server hour; WeekendBoost is then applied on weekend days.
# - Final per-bucket targets are clamped by PercLow/PercHigh relative to configured
#   base “Number” weights (see JobProfiles/Towns/Behaviors).
# - SmoothingMinutes interpolates between previous and next targets.
#
# JobProfiles              Weighted selection of job templates to instantiate.
#   - JobProfile           Id from FAKE_JOBPROFILS_DB (must exist).
#     Number               Relative weight (integer). Larger = more frequent.
# Notes:
# - Weights are relative; probability ≈ weight / sum(weights).
# - Use this to control class mix (e.g., more common jobs get higher weights).
#
# Towns                    Weighted list of spawn/idle rectangles in towns.
#   - Map                  Town map id (e.g., prontera, payon, geffen, izlude).
#     Number               Relative weight for selecting this town.
#     Startx/Starty        Top-left corner (inclusive) of the rectangle.
#     Endx/Endy            Bottom-right corner (inclusive) of the rectangle.
# Notes:
# - The engine picks a town by weight, then a random point inside [Start..End].
# - Provide multiple rectangles per town to diversify spawn clustering.
#
# Names                    Path to a text file with candidate character names.
#                          The engine draws from this file when creating bots.
#
# Behaviors                Weighted behaviors assigned to bots of this profile.
#   - Behavior             Behavior id (e.g., "grind", "afk_town").
#     Number               Relative weight (integer). Larger = more frequent.
#
###########################################################################
# Weighting & Targets — How numbers interact
###########################################################################
# - All “Number” fields are *relative weights* inside their list:
#     * JobProfiles → class mix.
#     * Towns       → town distribution and spawn rectangles.
#     * Behaviors   → behavior mix.
# - The population *Curve* shapes “how many” bots should be active over time.
#   Internally, the curve weight for the current hour/day is combined with
#   configured base weights and then clamped by PercLow/PercHigh.
# - SmoothingMinutes linearly eases toward the new target to prevent spikes
#   at the top of the hour.
#
###########################################################################
# Recommended conventions
###########################################################################
# - Keep weights small (e.g., 6..100) for readability; scale uniformly if needed.
# - Fill HourlyProfile/WeekendProfile with 24 values each; use gentle slopes.
# - Use multiple Town rectangles to avoid overcrowding a single cell range.
# - Tie Profiles.LevelMin/Max to the job profiles you assign (e.g., novice_world
#   spans low levels; starter_world overlaps into 10–25).
#
###########################################################################
# Troubleshooting
###########################################################################
# - “Bots not appearing in town X”: raise Towns[Map=X].Number or add more rectangles.
# - “Too many/few bots at certain hours”: adjust HourlyProfile/WeekendProfile,
#   WeekendBoost, or PercLow/PercHigh; increase SmoothingMinutes for slower ramps.
# - “Wrong class mix”: tune JobProfiles weights.
# - “Everyone grinding / everyone idle”: tune Behaviors weights (grind vs afk_town).
#
###########################################################################
# Example (abridged)
###########################################################################
# - Profiles: starter_world
#   LevelMin: 10
#   LevelMax: 25
#   Curve:
#     Enabled: true
#     SmoothingMinutes: 20
#     WeekendBoost: 1.25
#     PercLow: 20
#     PercHigh: 150
#     HourlyProfile:   [ ...24 ints... ]
#     WeekendProfile:  [ ...24 ints... ]
#   JobProfiles:
#     - { JobProfile: swordman_starter, Number: 100 }
#     - { JobProfile: mage_starter,     Number: 100 }
#     - { JobProfile: gunslinger_starter, Number: 30 }
#   Towns:
#     - { Map: prontera, Number: 30, Startx: 140, Starty: 192, Endx: 171, Endy: 160 }
#     - { Map: payon,    Number: 25, Startx: 155, Starty: 121, Endx: 188, Endy: 93 }
#   Names: fake_player_name.txt
#   Behaviors:
#     - { Behavior: grind,    Number: 90 }
#     - { Behavior: afk_town, Number: 10 }
###########################################################################

