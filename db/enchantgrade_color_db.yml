###########################################################################
# Enchant Grade Color Database
###########################################################################
#
# Enchant Grade Color Settings
#
###########################################################################
# Maps enchant grade names to display colors and labels.
#
# The server sends these as _GRADE_<N>_<Label> sentinel entries through the
# ZC_ITEM_COLOR_LIST (0x0BDD) packet. The WARP QJS patch extracts both
# the grade number and the display label, so no grade tables are hardcoded
# on either side.
#
# Format:
#   - Grade: <number>          (1=Rare, 2=Epic, 3=Mythic, 4=Legendary, 5=S)
#     Label: <display label without brackets>
#     Color: <RRGGBB hex>
#
# Color format: RRGGBB (standard web hex). Examples:
#   FF0000 = Red      00FF00 = Green     0000FF = Blue
#   FFA500 = Orange   DA70D6 = Orchid    FFD700 = Gold
#   DC143C = Crimson Red    A020F0 = Purple
#
# DEFAULT VALUES:
#   Rare        = 0000FF  (Blue)
#   Epic        = A020F0  (Purple)
#   Mythic      = DC143C  (Crimson Red)
#   Legendary   = FFD700  (Gold)
#   S           = FFD700  (Gold)
#
# Adding new grades:
#   1. Add the enum value in src/common/mmo.hpp (e.g. ENCHANTGRADE_ANCIENT = 6)
#   2. Add an entry below (e.g. Grade: 6 / Label: Ancient / Color: FF8800)
###########################################################################

Header:
  Type: ENCHANTGRADE_COLOR_DB
  Version: 1

# Grade numbers: 1=Rare, 2=Epic, 3=Mythic, 4=Legendary, 5=S
Body:
  - Grade: 1
    Label: Rare
    Color: 0000FF

  - Grade: 2
    Label: Epic
    Color: A020F0

  - Grade: 3
    Label: Mythic
    Color: DC143C

  - Grade: 4
    Label: Legendary
    Color: FFD700

  - Grade: 5
    Label: S
    Color: FFD700

Footer:
  Imports:
    - Path: db/import/enchantgrade_color_db.yml
