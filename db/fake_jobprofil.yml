###########################################################################
# Fake Job Profiles Database (Shakto) — Spec & Usage (EN)
###########################################################################
#
# Overview
# - This YAML defines *job profiles* used to spawn/drive fake players (bots):
#   starting stats, gear, (optional) skills, cosmetic hats, and preferred
#   field zones to roam/farm. Each profile can be referenced by name when
#   creating a fake player.
#
# File Layout
# - Header:
#     Type: FAKE_JOBPROFILS_DB
#     Version: 1
# - Body:
#     A list of JobProfile maps (see schema below).
#
###########################################################################
# JobProfile entry (schema)
###########################################################################
# JobProfile                Unique profile id (string). Used by spawners. (same name as fake_player.yml)
# Job                       Base job name (server job id, e.g., Novice, Swordman,
#                           Mage, Archer, Acolyte, Merchant, Thief, Gunslinger,
#                           Ninja, Taekwon). Must match server-side job enum.
#
# Base Stats (all integers; exact meaning is server-side)
#   Str, Agi, Vit, Int, Dex, Luk
#
# Equipment (Aegis names; must exist in item DB)
#   Weapon                   Primary weapon to equip (e.g., Orcish_Sword).
#   Shield                   Shield to equip (optional per job; e.g., Guard).
#   Arrow                    Boolean:
#                             - true  => profile uses ammo; server equips suitable
#                                        ammunition for the job (e.g., arrows/bullets).
#                             - false => no ammunition provisioning.
#                           NOTE: actual ammo type/resupply logic is server-side.
#
# Skills (optional)
#   Skills:                  List of skill entries; omit entirely if not needed.
#     - Skill                Skill constant (e.g., SM_BASH, MG_FIREBOLT).
#       Number               Skill *level* to set/learn (integer).
#
# Hats (optional cosmetics pool)
#   Hats:                    Weighted pool of headgears; one is picked at spawn.
#     - Hat                  Aegis name (or "none" for no hat).
#       Number               Selection *weight* (integer). Higher = more likely.
#
# FieldZones (movement/leveling targets)
#   FieldZones:              Weighted list of maps this profile prefers.
#     - Map                  Map name (server map id, e.g., prt_fild08).
#       Number               Selection *weight* (integer). Higher = more likely.
#   Notes:
#     * These weights are *relative frequencies*, not counts.
#     * Comments next to maps are purely descriptive for humans.
#
# Script (add more configuration of autoattack, buffs, effects etc...)
#
###########################################################################
# Selection & Weighting semantics
###########################################################################
# - Hats.Number and FieldZones.Number are *relative weights* used by the picker:
#     probability ≈ weight / sum(weights in the same list).
# - Keep weights small, positive integers (e.g., 4..40) for readability.
# - If a list is omitted or empty:
#     * Hats: no hat is equipped (unless enforced elsewhere).
#     * FieldZones: profile has no preferred maps (server behavior applies).
#
###########################################################################
# Recommended conventions
###########################################################################
# - Keep Weapon/Shield/Hat values aligned with item AegisName (no spaces).
# - Use Arrow: true only for profiles that actually rely on ammo
#   (e.g., Archer/Gunslinger). Leave false for melee/casters.
# - Skill levels (“Number”) should respect class caps and server rules.
# - Provide several FieldZones with weights to avoid deterministic paths.
# - Use comments to document level ranges or mob types for each map.
#
###########################################################################
# Example snippet
###########################################################################
# - JobProfile: swordman_starter
#   Job: Swordman
#   Str: 60; Agi: 20; Vit: 10; Int: 0; Dex: 40; Luk: 0
#   Weapon: Orcish_Sword
#   Shield: Shield
#   Arrow: false
#   Skills:
#     - { Skill: SM_BASH,    Number: 20 }
#     - { Skill: SM_ENDURE,  Number: 1  }
#   Hats:
#     - { Hat: Bandana, Number: 25 }
#     - { Hat: none,    Number: 10 }
#   FieldZones:
#     - { Map: pay_dun00, Number: 12 }  # Payon Cave 1F
#     - { Map: moc_fild07, Number: 12 } # Wolves 20–25
#
###########################################################################
# Troubleshooting
###########################################################################
# - “Item not found”: verify Aegis names exist in the item DB.
# - “Can’t equip”: confirm job/job-level can use the weapon/shield/hat.
# - “Wrong skill level”: ensure Skill constant is valid for the Job and
#   the Number (level) respects server caps.
# - “Never goes to map X”: increase FieldZones weight for that map, or
#   add more maps with similar weights to balance the pool.
###########################################################################

Header:
  Type: FAKE_JOBPROFILS_DB
  Version: 1

